[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spacecraft-ai"
version = "0.1.0"
description = "Phase-aware spacecraft anomaly detection (SMAP/MSL telemetry + Mars 2020 trajectory)"
requires-python = ">=3.10"
dependencies = ["numpy", "pandas", "scikit-learn", "torch", "matplotlib", "spiceypy",
                "fastapi", "uvicorn[standard]", "joblib"]

[project.optional-dependencies]
dev = ["pytest", "httpx"]

[tool.setuptools.packages.find]
where = ["src"]
